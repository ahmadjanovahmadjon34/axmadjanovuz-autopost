name: Avtomatik post

on:
  schedule:
    # Har 20 daqiqada, Toshkent vaqti bilan 07:00–23:59 (UTC 02–18)
    - cron: "*/20 2-18 * * *"
  workflow_dispatch:
    inputs:
      command:
        description: "run | collect"
        default: "run"

concurrency:
  group: autopost
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # navbatda turgan ishga tushish eng so'nggi holatni olishi uchun
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Agentlarni ishga tushirish
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OWNER_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
        run: python main.py ${{ github.event.inputs.command || 'run' }}
      - name: Holatni saqlash (takrorlanmaslik uchun)
        if: always()
        run: |
          git config user.name "autopost-bot"
          git config user.email "autopost-bot@users.noreply.github.com"
          git add -A data.db inbox
          git diff --cached --quiet && exit 0
          git commit -m "holat yangilandi"
          git pull --rebase origin main
          git push
