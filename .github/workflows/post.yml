name: Avtomatik post

on:
  schedule:
    # Har 20 daqiqada, Toshkent vaqti bilan 07:00–23:59 (UTC 02–18)
    - cron: "*/20 2-18 * * *"
  workflow_dispatch:
    inputs:
      command:
        description: "run | post | collect"
        default: "run"

concurrency:
  group: autopost
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Agentlarni ishga tushirish
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PREVIEW_CHAT_ID: ${{ secrets.PREVIEW_CHAT_ID }}
          PUBLISH_MODE: ${{ vars.PUBLISH_MODE }}
        run: python main.py ${{ github.event.inputs.command || 'run' }}
      - name: Holatni saqlash (takrorlanmaslik uchun)
        run: |
          git config user.name "autopost-bot"
          git config user.email "autopost-bot@users.noreply.github.com"
          git add data.db preview_chat_id.txt 2>/dev/null || git add data.db
          git diff --cached --quiet || git commit -m "holat yangilandi" && git push
